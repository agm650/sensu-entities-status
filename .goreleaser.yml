---
version: 2

builds:
  - id: entrypoint
    env:
      - CGO_ENABLED=0
    main: ./main.go
    binary: bin/entrypoint
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_sha512-checksums.txt"
  algorithm: sha512

archives:
  - id: tar
    formats:
      - tar.gz
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
